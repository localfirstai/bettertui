[workspace]
resolver = "2"
members = [
  "crates/engine",
  "crates/benchmark",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/localfirstai/bettertui"
description = "High-performance terminal UI framework"
rust-version = "1.88"
homepage = "https://bettertui.dev"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = "0.7"
crossterm = "0.28"
ropey = "1.1"
regex = "1"
unicode-width = "0.2"
unicode-segmentation = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
slotmap = "1.0"
smallvec = "1.13"
bitflags = "2"
portable-pty = "0.8"
tempfile = "3"
