[package]
name = "bettertui-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Consolidated end-to-end benchmarks for BetterTUI Rust crates"
publish = false

[lib]
name = "bettertui_benchmark"
path = "src/lib.rs"

[dependencies]
bettertui-engine = { path = "../engine" }
bettertui-widgets = { path = "../widgets" }
bettertui-terminal = { path = "../terminal" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
