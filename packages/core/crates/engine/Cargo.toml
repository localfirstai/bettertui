[package]
name = "bettertui-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BetterTUI native rendering engine"

[lib]
name = "bettertui_engine"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[[bin]]
name = "layout_e2e"
path = "src/bin/layout_e2e.rs"

[dependencies]
taffy.workspace = true
crossterm.workspace = true
ropey.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
slotmap.workspace = true
smallvec.workspace = true
bitflags.workspace = true
portable-pty.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
cfonts = { version = "1.3", default-features = false }
thiserror = "2.0"

# Tree-sitter for syntax highlighting
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"

# napi-rs for Node.js bindings
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
serde_json = { workspace = true }
napi-build = "2"

[dev-dependencies]
insta = { version = "1.42", features = ["yaml", "redactions"] }
vt100 = "0.16"
proptest = "1"
